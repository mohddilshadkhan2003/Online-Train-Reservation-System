<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RailEase Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script>
        function fillTrainName() {
            const trainNo = document.getElementById('trainNo').value;
            const field = document.getElementById('trainName');
            const trains = {
                '12002': 'Bhopal Shatabdi',
                '12952': 'Mumbai Rajdhani',
                '12301': 'Howrah Rajdhani',
                '12627': 'Karnataka Express',
                '22435': 'Jabalpur Express',
                '20801': 'Patna Superfast'
            };
            field.value = trains[trainNo] || '';
        }
    </script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">RailEase</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <span>Signed in as <strong th:text="${username}"></strong></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Log out</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Book a journey</h3>
                    <form th:action="@{/dashboard/book}" th:object="${bookingForm}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Passenger Name</label>
                                <input type="text" class="form-control" th:field="*{passenger}" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Train Number</label>
                                <input type="text" id="trainNo" class="form-control" th:field="*{trainNo}" oninput="fillTrainName()" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Train Name</label>
                                <input type="text" id="trainName" class="form-control" th:field="*{trainName}" readonly/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Travel Class</label>
                                <select class="form-select" th:field="*{travelClass}">
                                    <option value="Select class">Select class</option>
                                    <option value="First AC (1A)">First AC (1A)</option>
                                    <option value="Second AC (2A)">Second AC (2A)</option>
                                    <option value="Third AC (3A)">Third AC (3A)</option>
                                    <option value="Sleeper (SL)">Sleeper (SL)</option>
                                    <option value="Second Sitting (2S)">Second Sitting (2S)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date of journey</label>
                                <input type="text" class="form-control" th:field="*{journeyDate}" placeholder="DD-MM-YYYY" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Source</label>
                                <input type="text" class="form-control" th:field="*{source}" required/>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Destination</label>
                                <input type="text" class="form-control" th:field="*{destination}" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Confirm booking</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="mb-0">Reservations overview</h3>
                        <form class="d-flex gap-2" method="get" th:action="@{/dashboard}">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search passenger / PNR / route" />
                            <button type="submit" class="btn btn-outline-primary">Search</button>
                        </form>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-primary">
                            <tr>
                                <th>PNR</th>
                                <th>Passenger</th>
                                <th>Train</th>
                                <th>Class</th>
                                <th>Date</th>
                                <th>Route</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(reservations)}">
                                <td colspan="7" class="text-center text-muted">No reservation found.</td>
                            </tr>
                            <tr th:each="reservation : ${reservations}">
                                <td th:text="${reservation.pnr}"></td>
                                <td th:text="${reservation.passenger}"></td>
                                <td th:text="${reservation.trainNo + ' · ' + reservation.trainName}"></td>
                                <td th:text="${reservation.travelClass}"></td>
                                <td th:text="${#temporals.format(reservation.journeyDate, 'dd-MM-yyyy')}"></td>
                                <td th:text="${reservation.source + ' → ' + reservation.destination}"></td>
                                <td>
                                    <form th:action="@{'/dashboard/cancel/' + ${reservation.pnr}}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
